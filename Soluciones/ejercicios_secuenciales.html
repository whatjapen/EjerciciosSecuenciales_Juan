<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicios estructura secuencial</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#1b2430;--mute:#5d6b7c;--line:#d5dbe3;--acc:#2f5fd0;--code:#1e1f22;--codeink:#d6dae0;--mark:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1c1f25;--ink:#e6e9ee;--mute:#9aa6b5;--line:#2d333c;--acc:#7aa2ff;--code:#0f1013;--codeink:#d6dae0;--mark:#6b5a12}}
*{box-sizing:border-box}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px}
.in{max-width:820px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 10px}
.bar{display:flex;gap:10px;align-items:center}
input{flex:1;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#n{color:var(--mute);font-size:.9rem;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:16px}
article{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden}
article h2{font-size:1.05rem;margin:0;padding:14px 16px 4px}
article p{margin:0;padding:0 16px 12px;color:var(--mute)}
.meta{font-size:.82rem;color:var(--mute);padding:0 16px 10px}
.cw{position:relative;background:var(--code)}
pre{margin:0;padding:14px 16px;overflow-x:auto;color:var(--codeink);font:13.5px/1.5 ui-monospace,Consolas,monospace}
button{position:absolute;top:8px;right:8px;font:inherit;font-size:.8rem;padding:4px 10px;border-radius:6px;border:1px solid #444;background:#2b2d31;color:#d6dae0;cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px}
#vacio{display:none;text-align:center;color:var(--mute);padding:40px 0}
</style>
</head>
<body>
<header><div class="in">
<h1>Ejercicios estructura secuencial</h1>
<div class="bar"><input id="q" type="search" placeholder="Busca por número, palabra o código (tecla /)" aria-label="Buscar ejercicios" autofocus><span id="n"></span></div>
</div></header>
<main id="lista"></main>
<div id="vacio">Sin resultados. Prueba otra palabra, por ejemplo "raíz" o "input".</div>
<script>
// Datos: [número, enunciado, código]
const E=[
[1,"Escribir un programa que pregunte al usuario su nombre, y luego lo salude.",
`nombre = input("introduzca su nombre: ")
print("hola", nombre)`],
[2,"Calcular el perímetro y área de un rectángulo dada su base y su altura.",
`base=int(input("Dime la base: "))
altura=int(input("Dime la altura: "))
area=(base*altura)
perimetro=2*(base+altura)
# Si es incompatible da error
if base<=0 or altura<=0:
    print ("error")
else:
    print ("Area",area)
    print("Perimetro", perimetro)`],
[3,"Dados los catetos de un triángulo rectángulo, calcular su hipotenusa.",
`a = float(input("Cateto a: "))
b = float(input("Cateto b: "))
#Teorema de pitagoras
c=pow((a**2+b**2),1/2)
print (c)`],
[4,"Dados dos números, mostrar la suma, resta, división y multiplicación de ambos.",
`numero1=int(input("Dame un numero: "))
numero2=int(input("Dame otro numero: "))
print("Suma",numero1+numero2)
print("Resta",numero1-numero2)
print("División",numero1/numero2)
print("Multiplicación",numero1*numero2)`],
[5,"Escribir un programa que convierta un valor dado en grados Fahrenheit a grados Celsius. Recordar que la fórmula para la conversión es: C = (F-32)*5/9",
`F=int(input("Fahrenheit: "))
C=(F-32)*5/9
print ("Celsius", C)`],
[6,"Calcular la media de tres números pedidos por teclado.",
`num1=float(input("Numero 1: "))
num2=float(input("Numero 2: "))
num3=float(input("Numero 3: "))
media=(num1+num2+num3)/3
print (media)`],
[7,"Realiza un programa que reciba una cantidad de minutos y muestre por pantalla a cuantas horas y minutos corresponde. Por ejemplo: 1000 minutos son 16 horas y 40 minutos.",
`mins=int(input("Minutos: "))
horas=mins//60
resto=mins%60
print(mins,"minutos son",horas,"horas y",resto,"minutos")`],
[8,"Un vendedor recibe un sueldo base más un 10% extra por comisión de sus ventas, el vendedor desea saber cuánto dinero obtendrá por concepto de comisiones por las tres ventas que realiza en el mes y el total que recibirá en el mes tomando en cuenta su sueldo base y comisiones.",
`sueldo=int(input("sueldo: "))
ventas=int(input("ventas: "))
comision=0.10*ventas
final=comision+sueldo
print ("Sueldo base: ", sueldo)
print ("tiene ", final, "sumandole las comisiones")
print ("% en comisiones: ", comision)`],
[9,"Una tienda ofrece un descuento del 15% sobre el total de la compra y un cliente desea saber cuánto deberá pagar finalmente por su compra.",
`total = float(input("Total compra: "))
print("Pagas:", total * 0.85)`],
[10,"Un alumno desea saber cuál será su calificación final en la materia de Algoritmos. Dicha calificación se compone de: 55% del promedio de sus tres calificaciones parciales, 30% de la calificación del examen final y 15% de la calificación de un trabajo final.",
`p1, p2, p3 = float(input("Parcial 1: ")), float(input("Parcial 2: ")), float(input("Parcial 3: "))
ex = float(input("Examen final: "))
tr = float(input("Trabajo final: "))
print("Nota final:", (p1 + p2 + p3) / 3 * 0.55 + ex * 0.30 + tr * 0.15)`],
[11,"Pide al usuario dos números y muestra la \"distancia\" entre ellos (el valor absoluto de su diferencia, de modo que el resultado sea siempre positivo).",
`a, b = int(input("Número 1: ")), int(input("Número 2: "))
print("Distancia:", abs(a - b))`],
[12,"Pide al usuario dos pares de números x1,y1 y x2,y2, que representen dos puntos en el plano. Calcula y muestra la distancia entre ellos.",
`#Importo la libreria math
import math
x1, y1 = float(input("x1: ")), float(input("y1: "))
x2, y2 = float(input("x2: ")), float(input("y2: "))
print("Distancia:", math.hypot(x2 - x1, y2 - y1))  # Pitágoras`],
[13,"Realizar un algoritmo que lea un número y que muestre su raíz cuadrada y su raíz cúbica. Python3 no tiene ninguna función predefinida que permita calcular la raíz cúbica, ¿Cómo se puede calcular?",
`n = float(input("Número: "))
print("Cuadrada:", n ** 0.5)     # elevar a 1/2
print("Cúbica:", n ** (1 / 3))   # elevar a 1/3`],
[14,"Dado un número de dos cifras, diseñe un algoritmo que permita obtener el número invertido. Ejemplo, si se introduce 23 que muestre 32.",
`numero = int(input("Número de 2 cifras: "))
print("Invertido:", numero % 10 * 10 + numero // 10)  # unidad pasa a decena`],
[15,"Dadas dos variables numéricas A y B, que el usuario debe teclear, se pide realizar un algoritmo que intercambie los valores de ambas variables y muestre cuánto valen al final las dos variables.",
`A, B = input("A: "), input("B: ")
A, B = B, A  # cambio directo
print("A =", A, "B =", B)`],
[16,"Dos vehículos viajan a diferentes velocidades (v1 y v2) y están distanciados por una distancia d. El que está detrás viaja a una velocidad mayor. Se pide hacer un algoritmo para ingresar la distancia entre los dos vehículos (km) y sus respectivas velocidades (km/h) y con esto determinar y mostrar en que tiempo (minutos) alcanzará el vehículo más rápido al otro.",
`d = float(input("Distancia (km): "))
v1 = float(input("Velocidad del de atrás (km/h): "))
v2 = float(input("Velocidad del de adelante (km/h): "))
print("Minutos:", d / (v1 - v2) * 60)`],
[17,"Un ciclista parte de una ciudad A a las HH horas, MM minutos y SS segundos. El tiempo de viaje hasta llegar a otra ciudad B es de T segundos. Escribir un algoritmo que determine la hora de llegada a la ciudad B.",
`hh, mm, ss = int(input("Horas: ")), int(input("Minutos: ")), int(input("Segundos: "))
t = int(input("Segundos de viaje: "))
#hh * 3600: horas a segundos (1 hora = 3600 s).
#mm * 60: minutos a segundos.
s = hh * 3600 + mm * 60 + ss + t  # 86400 s = un día. Si pasa, vuelve a 0
print("Llegada:", s // 3600 % 24, "h", s // 60 % 60, "min", s % 60, "s")`],
[18,"Pedir el nombre y los dos apellidos de una persona y mostrar las iniciales.",
`nom, ap1, ap2 = input("Nombre: "), input("Apellido 1: "), input("Apellido 2: ")
print (nom[0] + ap1[0] + ap2[0]) # [0] significa la primera letra de la variable`],
[19,"Escribir un algoritmo para calcular la nota final de un estudiante, considerando que: por cada respuesta correcta 5 puntos, por una incorrecta -1 y por respuestas en blanco 0. Imprime el resultado obtenido por el estudiante.",
`ok = int(input("Correctas: "))
mal = int(input("Incorrectas: "))
print("Nota:", ok * 5 - mal)  # en blanco = 0, no se cuenta`],
[20,"Diseñar un algoritmo que nos diga el dinero que tenemos (en euros y céntimos) después de pedirnos cuantas monedas tenemos (de 2€, 1€, 50 céntimos, 20 céntimos o 10 céntimos).",
`m2 = int(input("Monedas de 2€: "))
m1 = int(input("Monedas de 1€: "))
m50 = int(input("Monedas de 50c: "))
m20 = int(input("Monedas de 20c: "))
m10 = int(input("Monedas de 10c: "))
cent = m2 * 200 + m1 * 100 + m50 * 50 + m20 * 20 + m10 * 10  #en centimos
print(cent // 100, "euros y", cent % 100, "céntimos")`]
];

const lista=document.getElementById("lista"), q=document.getElementById("q"),
      n=document.getElementById("n"), vacio=document.getElementById("vacio");

// Quita tildes y mayúsculas para buscar fácil
const norm=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

// Resalta la palabra buscada (en texto ya escapado)
function marca(txt,t){
  const h=esc(txt);
  if(!t) return h;
  const i=norm(txt).indexOf(t);
  if(i<0) return h;
  // solo resalta si el escape no cambió posiciones
  if(h.length!==txt.length) return h;
  return h.slice(0,i)+"<mark>"+h.slice(i,i+t.length)+"</mark>"+h.slice(i+t.length);
}

function pinta(){
  const t=norm(q.value.trim());
  const r=E.filter(([k,e,c])=>!t||norm("ejercicio "+k+" "+e+" "+c).includes(t));
  lista.innerHTML=r.map(([k,e,c])=>
    `<article id="e${k}"><h2>Ejercicio ${k}</h2><p>${marca(e,t)}</p>
     <div class="meta">Hecho el ${k<=8?"27/10/2026":"03/11/2026"} · Por: Juan Agea Rodríguez</div>
     <div class="cw"><button type="button" data-c="${k}">Copiar</button><pre>${marca(c,t)}</pre></div></article>`).join("");
  n.textContent=r.length+" de "+E.length;
  vacio.style.display=r.length?"none":"block";
}

q.addEventListener("input",pinta);
// Tecla "/" lleva al buscador
document.addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus();}
});
// Botón copiar
lista.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const cod=E.find(x=>x[0]==b.dataset.c)[2];
  navigator.clipboard.writeText(cod).then(()=>{b.textContent="Copiado";setTimeout(()=>b.textContent="Copiar",1200);});
});
pinta();
</script>
</body>
</html>
